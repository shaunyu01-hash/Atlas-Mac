# Builds the desktop program as Mac apps, for Apple silicon and for Intel Macs.
# Run it from the Actions tab (Mac app > Run workflow), then download the zips from the run's Artifacts.
# Pushing a tag such as v1.0 also attaches the zips to a GitHub release.
name: Mac app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            chip: apple-silicon
          - runner: macos-15-intel
            chip: intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the apps
        run: PYTHON=python bash mac/build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-PO-ERP-Mac-${{ matrix.chip }}
          path: apps/desktop/dist/mac/*.zip
          if-no-files-found: error

      - name: Check the program on a Mac (sample data, printed papers, opening files)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          source build/mac-env/bin/activate
          export PO_DATA_DIR="$RUNNER_TEMP/po-data" PO_SAMPLE_DIR="$RUNNER_TEMP/po-sample"
          python -E -c "from atlaspo import sample_data, pdf; sample_data.ensure(); print('sample built; PDF fonts:', pdf._fonts())"
          python -E -m pytest tests/test_delivery_receipts.py tests/test_fix_attachments.py tests/test_reprints.py -q -p no:cacheprovider

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: zips/*.zip
